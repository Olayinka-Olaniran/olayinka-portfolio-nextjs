    <text x="348" y="256">Five featured projects spanning form validation, custom parsing, live API data,</text>
    <text x="348" y="274">persistent state, and interactive UI &#8212; each built from scratch to sharpen core</text>
    <text x="348" y="292">JavaScript before layering on tools like Tailwind, React, and TypeScript.</text>
  </g>

